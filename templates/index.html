<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>D&D site</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="index">

    <!-- NAV -->
    <nav class="navbar">
        <div class="logo">DnD Builder</div>
        <ul>
            <li><a href="{{ url_for('home') }}">Home</a></li>

            {% if user %}
            <li><a href="{{ url_for('character_list') }}">My Characters</a></li>
            <li><a href="{{ url_for('charactercreation') }}">Create Character</a></li>
            <li><a href="{{ url_for('logout') }}">Logout ({{ user.username }})</a></li>
            {% else %}
            <li><a href="{{ url_for('login') }}">Login</a></li>
            <li><a href="{{ url_for('register') }}">Register</a></li>
            {% endif %}
        </ul>
    </nav>

    <!-- HERO SECTION -->
    <main class="hero">
        <h1>Welcome, Adventurer</h1>
        <p>
            Create heroes, explore lore, and prepare for your next campaign.
        </p>

        <div class="hero-buttons">
            <a href="{{ url_for('charactercreation') }}" class="btn primary">Create a Character</a>
            <a href="{{ url_for('wikipage') }}" class="btn secondary">Explore the World</a>
        </div>
    </main>

    <footer>
        <p> </p>
    </footer>

</body>
</html>
