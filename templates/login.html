<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-light: #2b2b2b;
            --accent: #c9aa71;
            --text-light: #f5f5f5;
        }

        body {
            background: radial-gradient(circle, #2b2b2b, #121212);
            color: var(--text-light);
            font-family: "Trebuchet MS", serif;
            text-align: center;
            padding-top: 80px;
            margin: 0;
        }

        form {
            display: inline-block;
            padding: 30px 20px;
            background-color: var(--bg-light);
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: var(--accent);
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

            button:hover {
                background-color: #e6c98c;
            }

        a {
            display: block;
            margin-top: 10px;
            color: var(--accent);
            text-decoration: none;
        }

            a:hover {
                color: #e6c98c;
            }

        div[style] {
            color: red;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <h2>Login</h2>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    {% for message in messages %}
    <div style="color: red;">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <button type="submit">Login</button>
    </form>

    <a href="{{ url_for('register') }}">Create account</a>

</body>
</html>
