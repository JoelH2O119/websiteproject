<!DOCTYPE html>
<html>
<head>
    <title>Character creation</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}" />
</head>
<body>

    <nav>
        <ul>
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('charactercreation') }}">Go to character creation Page</a></li>
            <li><a href="{{ url_for('wikipage') }}">Go to wiki Page</a></li>
            <li><a href="#about">About</a></li>
        </ul>
    </nav>
    <label>Character Name:</label>
    <input type="text" name="name" required>

    <label>Alignment:</label>
    <select name="alignment">
        <option>Lawful Good</option>
        <option>Neutral Good</option>
        <option>Chaotic Good</option>
        <option>Lawful Neutral</option>
        <option>Neutral</option>
        <option>Chaotic Neutral</option>
        <option>Lawful Evil</option>
        <option>Neutral Evil</option>
        <option>Chaotic Evil</option>
    </select>

    <label>Strength:</label>
    <input type="number" name="str">

    <label>Dexterity:</label>
    <input type="number" name="dex">

    <label>Constitution:</label>
    <input type="number" name="con">

    <label>Intelligence:</label>
    <input type="number" name="int">

    <label>Wisdom:</label>
    <input type="number" name="wis">

    <label>Charisma:</label>
    <input type="number" name="cha">



    <p>This is another page in your site!</p>
    <a href="{{ url_for('home') }}">Back to Home</a>
</body>
</html>
